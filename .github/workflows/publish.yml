name: Publish to NPM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0)'
        required: true
        type: string

# 最小权限原则：默认只读，需要写权限的 job 单独提升
permissions:
  contents: read

# 避免并发发布：同一 ref 的多次触发排队执行，绝不取消进行中的发布
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-native:
    name: Build native accelerator (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32-x64
          - os: macos-15-intel
            platform: darwin-x64
          - os: macos-14
            platform: darwin-arm64
          - os: ubuntu-latest
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Build native accelerator
        shell: bash
        run: SNOW_NATIVE_TARGET=${{ matrix.platform }} node scripts/build-native.cjs

      - name: Upload native accelerator
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snow-native-${{ matrix.platform }}
          path: bundle/native/*.node
          if-no-files-found: error

  publish:
    needs: build-native
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # 创建 GitHub Release
      id-token: write # npm provenance (SLSA 供应链来源证明)

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Use CI npm config
        run: cp .npmrc.ci .npmrc

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: package.json=$PKG_VERSION, tag=$TAG_VERSION"
            exit 1
          fi
          echo "Version matches: $PKG_VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Download cross-platform native accelerators
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: snow-native-*
          path: bundle/native
          merge-multiple: true

      - name: Verify publish contents
        run: npm pack --dry-run

      - name: Publish to NPM
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Snow CLI ${{ github.ref_name }}

            ### What's New

            - Tool-call correction is now reflected in conversation history: when the correction agent repairs a failed call and the retry succeeds, the repaired arguments replace the original ones in the assistant `tool_calls` message. Both the in-memory context and the persisted session therefore contain exactly the call that actually ran, with no repair note and no failed intermediate attempts leaking into the main flow; the correction status note was also rewritten to describe the repair accurately
            - Large-file diffs are dramatically faster: diff previews take an exact-match fast path before falling back to the expensive sliding-window similarity scan, and that scan now pre-filters candidate windows with prefix-sum length checks. `DiffViewer` keeps only six context lines around the change before handing content to jsdiff, falls back to simple replacement hunks for enormous near-total rewrites (every line is still rendered), skips the per-line hashline scan when no anchors are present, wraps ANSI-coloured output without O(n^2) re-slicing, and gains light-theme syntax colours; terminal previews and the confirmation panel now share one file reader so both produce an identical diff
            - Plugin panel state survives terminal resize: `AnyPanel` now reloads and re-initializes a plugin only when its `pluginId` changes. Width, language, session and translation updates re-render in place, and per-instance `initialized`/`disposed`/`cleaned` flags make cleanup idempotent, so hot reloads and refresh timers can no longer touch stale instances or reset host UI state
            - Cleaner editor context: cursor line and column are no longer injected into user messages, because they are not a reliable instruction target and could make the model misjudge where the user's focus actually is. The active file and the selected code are still included
            - Speedometer and Ultra TODO mode are now enabled by default: both can still be turned off explicitly (`/speedometer off`, `/ultra-todo`), and an explicit `false` is honored on startup. Command descriptions and the documentation now state the default

            ### Installation
            ```bash
            npm install -g snow-ai
            ```

            ### Usage
            ```bash
            snow
            ```
            ### Update
            ```bash
            snow --update
            ```
          draft: false
          prerelease: false
